name: Update Cloudflare version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (0.0.0, v0.0.0, or V0.0.0)
        required: true
        default: 0.0.0
        type: string
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: update-cloudflare-version
  cancel-in-progress: false

jobs:
  update-version:
    name: Write and verify version
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            raw_version="$RELEASE_TAG"
          else
            raw_version="$MANUAL_VERSION"
          fi

          if [[ "$raw_version" =~ ^[vV]?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Version must be MAJOR.MINOR.PATCH with an optional v or V prefix; received: $raw_version" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" && ! "$raw_version" =~ ^[vV] ]]; then
            echo "Release tag must start with v or V; received: $raw_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Update Workers KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID variable}"
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_KV_NAMESPACE_ID:?Missing CLOUDFLARE_KV_NAMESPACE_ID variable}"

          manifest="$(jq -cn --arg version "$VERSION" '{version: $version}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${CLOUDFLARE_KV_NAMESPACE_ID}/values/latest" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$manifest")"
          jq -e '.success == true' <<< "$response" > /dev/null

      - name: Verify public endpoint
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://notepadpp-dlms-update-api.ikjx.workers.dev/latest.json'
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error "$endpoint" | jq -r '.version')"
            if [[ "$actual" == "$VERSION" ]]; then
              echo "Verified $endpoint returns version $VERSION."
              exit 0
            fi
            sleep 5
          done
          echo "Endpoint did not return version $VERSION within 60 seconds." >&2
          exit 1
